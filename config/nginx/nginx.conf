events {}

http {
    server {
       listen 80;
       listen [::]:80;
       root /var/www/public;

       index index.php

       charset utf-8;

       location / {
            try_files $uri $uri/ /index.php?$query_string;
       }

       location = /index.php {
            fastcgi_pass backend:9000;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
       }
    }
}