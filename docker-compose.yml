# Only for dev purposes
services:
    backend:
        build:
            context: ./containers/backend
            dockerfile: Dockerfile
            args:
                - PHP_VERSION=${PHP_VERSION}
                - COMPOSER_VERSION=${COMPOSER_VERSION}
        volumes:
            -   ./code:/var/www
        working_dir: /var/www
        expose:
            -  9000
        environment:
            - APP_KEY
            - BCRYPT_ROUNDS
            - APP_NAME
            - APP_ENV
            - APP_DEBUG
            - APP_URL
            - DB_CONNECTION
            - DB_HOST
            - DB_PORT
            - MYSQL_DATABASE
            - MYSQL_ROOT_PASSWORD
            - MYSQL_USER
            - MYSQL_PASSWORD

    webserver:
        image: nginx:${NGINX_VERSION}
        ports:
            - 127.0.0.1:${WEBSERVER_PORT}:80
        volumes:
            - type: bind
              source: ${NGINX_CONF}
              target: /etc/nginx/nginx.conf
              read_only: true
            - ./code:/var/www
    db:
        image: mysql:8.0
        ports:
            - 127.0.0.1:${MYSQL_PORT}:3306
        environment:
            - MYSQL_PORT
            - MYSQL_DATABASE
            - MYSQL_ROOT_PASSWORD
            - MYSQL_USER
            - MYSQL_PASSWORD
        volumes:
            -   db_data:/var/lib/mysql

volumes:
    db_data: